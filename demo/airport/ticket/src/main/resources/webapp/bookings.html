<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        nav { margin-bottom: 20px; }
        nav a { color: #0066cc; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f4f4f4; }
        button { margin-top: 16px; padding: 10px 24px; background: #cc3333; color: white; border: none; cursor: pointer; }
        button:hover { background: #a32828; }
        .empty { color: #999; font-style: italic; margin-top: 12px; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/bookings.html">Bookings</a>
        <a href="/graphql.html">GraphQL</a>
    </nav>
    <h1>Bookings</h1>
    <table id="bookingsTable">
        <thead>
            <tr>
                <th>Passenger ID</th>
                <th>Passenger Name</th>
                <th>Flight</th>
                <th>Route</th>
                <th>Departure</th>
                <th>Reference</th>
            </tr>
        </thead>
        <tbody id="bookingsBody"></tbody>
    </table>
    <p id="empty" class="empty" style="display:none">No bookings found.</p>
    <button id="clearBtn">Clear All Bookings</button>
    <script>
        async function loadBookings() {
            const resp = await fetch('/api/bookings');
            const data = await resp.json();
            const tbody = document.getElementById('bookingsBody');
            const empty = document.getElementById('empty');
            const table = document.getElementById('bookingsTable');
            tbody.innerHTML = '';
            const entries = Object.entries(data);
            if (entries.length === 0) {
                table.style.display = 'none';
                empty.style.display = 'block';
            } else {
                table.style.display = 'table';
                empty.style.display = 'none';
                for (const [pid, b] of entries) {
                    const row = document.createElement('tr');
                    row.innerHTML = `<td>${pid}</td><td>${b.passengerName || ''}</td><td>${b.flightNumber || ''}</td><td>${b.route || ''}</td><td>${b.departureDateTime || ''}</td><td>${b.bookingReference || ''}</td>`;
                    tbody.appendChild(row);
                }
            }
        }
        document.getElementById('clearBtn').addEventListener('click', async () => {
            await fetch('/api/bookings', { method: 'DELETE' });
            loadBookings();
        });
        loadBookings();
    </script>
</body>
</html>
