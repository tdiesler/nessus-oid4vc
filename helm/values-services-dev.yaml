#
# helm upgrade --kube-context=rancher-desktop --install nessus-services ./helm -f ./helm/values-services-dev.yaml
#
environment: dev

deployments:

  # Backdoor for PV access
  #
  busybox:
    pullPolicy: IfNotPresent

  # SQL Service
  #
  postgres:
    version: 17.4
    nodePort: 30543

  # Keycloak Service
  #
  keycloak:
    imagePrefix: "quay.io/keycloak/"
    image: "keycloak"
    # Server image version — independent of admin-client version in pom.xml
    version: 26.7.4
    nodePort: 30800
    pullPolicy: IfNotPresent
