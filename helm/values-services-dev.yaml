environment: dev

deployments:

  # SQL Service
  #
  postgres:
    version: 17.4
    nodePort: 30543

  # Keycloak Service
  #
  keycloak:
    imagePrefix: "quay.io/keycloak/"
    image: "keycloak"
    version: 26.7
    nodePort: 30800
    pullPolicy: IfNotPresent
